[package]
name = "shush"
version = "0.1.2"
description = "Offline-first, zero-knowledge password manager & 2FA authenticator for Windows"
edition = "2021"
rust-version = "1.80"
publish = false
default-run = "shush"

[lib]
# The crypto/vault core lives in the library so it can be unit-tested without
# booting the Tauri runtime; `main.rs` is a thin entry point.
name = "shush_lib"
crate-type = ["rlib"]

[[bin]]
name = "shush"
path = "src/main.rs"

# Native-messaging relay (issue #51): no Tauri or vault code, ships beside shush.exe.
[[bin]]
name = "shush-host"
path = "src/bin/shush-host.rs"

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Spec §2.1 (versions pinned per the master specification) ---
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# `zeroize` feature: wipe Argon2's internal memory blocks on drop.
argon2 = { version = "0.5", features = ["std", "alloc", "zeroize"] }
# `zeroize` feature: wipe expanded cipher key schedules on drop.
aes-gcm = { version = "0.10", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive", "zeroize_derive"] }
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `otpauth`: parse otpauth:// URIs so imported issuers keep algorithm/digits/period (issue #24).
totp-rs = { version = "5.5", features = ["gen_secret", "otpauth", "steam"] }
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_RemoteDesktop",
    # Clipboard with history/cloud exclusion formats (issue #12).
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Auto-lock on session lock / suspend / display off / idle (issue #15).
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    # Deleted vaults go to the Recycle Bin.
    "Win32_UI_Shell",
    # Authenticated browser-bridge pipe (issue #16).
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    # Per-user native-messaging host registration under HKCU (issue #53).
    "Win32_System_Registry",
    "Win32_System_Threading",
    # Crash reports exclude heap memory (issue #6).
    "Win32_System_ErrorReporting",
    # Safe memory scanning for memory hygiene regression tests (issue #59).
    "Win32_System_Diagnostics_Debug",
] }
# --- Additions ---
thiserror = "2"
tauri-plugin-dialog = "2"
unicode-normalization = "0.1"
tauri-plugin-single-instance = "2"
csv = "1"
base64 = "0.22"
# Browser bridge (issue #16, #54): request MACs, SPAKE2 pairing, origin normalization (IDNA, default ports).
hmac = "0.12"
spake2 = "0.4"
url = "2"
minisign-verify = "0.2"
semver = "1"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
hex = "0.4"
minisign = "0.7"
tempfile = "3"

# Argon2 is unusably slow without optimisation; keep test/dev builds fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
