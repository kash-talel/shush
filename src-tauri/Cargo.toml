[package]
name = "shush"
version = "0.1.2"
description = "Offline-first, zero-knowledge password manager & 2FA authenticator for Windows"
edition = "2021"
rust-version = "1.80"
publish = false
default-run = "shush"

[lib]
# The crypto/vault core lives in the library so it can be unit-tested without
# booting the Tauri runtime; `main.rs` is a thin entry point.
name = "shush_lib"
crate-type = ["rlib"]

[[bin]]
name = "shush"
path = "src/main.rs"

# Native-messaging relay (issue #51): no Tauri or vault code, ships beside shush.exe.
[[bin]]
name = "shush-host"
path = "src/bin/shush-host.rs"

[features]
# Network support (issue #157). Every socket opener lives in `net.rs` behind this
# feature; build with `--no-default-features` for a binary with no socket code.
# Even with it on, shush starts air-gapped and the user must opt in.
default = ["network"]
network = ["dep:mdns-sd", "dep:if-addrs"]

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Spec §2.1 (versions pinned per the master specification) ---
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# `zeroize` feature: wipe Argon2's internal memory blocks on drop.
argon2 = { version = "0.5", features = ["std", "alloc", "zeroize"] }
# `zeroize` feature: wipe expanded cipher key schedules on drop.
aes-gcm = { version = "0.10", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# rand upgrade roadmap (issue #91; spec 2.1 points here). Stay on rand 0.8 / rand_core 0.6 until
# spake2 (fed an RNG by shush), argon2 (password-hash), aes-gcm / chacha20poly1305 (crypto-common)
# and snow move to rand_core 0.9. The one shush type that crosses the rand_core boundary is the
# FixedRng test double in sync/pairing.rs, passed to spake2's start_*_with_rng, so bump rand only
# together with spake2. rand 0.9 already sits in Cargo.lock via transitive deps; that is harmless.
# Call sites to port together (all in src/):
# - crypto/mod.rs fill_random: OsRng.try_fill_bytes, already maps failure to CryptoError::Rng; keep it.
# - vault/registry.rs: OsRng.fill_bytes (panics on RNG failure) -> try_fill_bytes + error.
# - crypto/generator.rs: OsRng + SliceRandom::choose -> IndexedRandom::choose over a fallible
#   wrapper (0.9 OsRng is TryRngCore only, `os_rng` feature); never `unwrap_err()` into a panic.
# - lib.rs update jitter: thread_rng().gen_range -> rng().random_range.
# - sync/pairing.rs test FixedRng: RngCore/CryptoRng impl, rand::Error.
rand = "0.8"
zeroize = { version = "1.7", features = ["derive", "zeroize_derive"] }
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `otpauth`: parse otpauth:// URIs so imported issuers keep algorithm/digits/period (issue #24).
totp-rs = { version = "5.5", features = ["gen_secret", "otpauth", "steam"] }
# windows-sys stays for plain Win32 calls (issue #91). WinRT (Windows Hello) uses the `windows` crate below;
# the two coexist. Bump windows-sys 0.52 -> 0.59+ in its own PR: it is a code migration, not a rename,
# because HANDLE/HWND change from isize to *mut c_void (integer compares such as os/clipboard.rs
# SetClipboardData(..) == 0 and the casts in os/pipe.rs stop compiling, and handles lose Send/Sync).
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_RemoteDesktop",
    # Clipboard with history/cloud exclusion formats (issue #12).
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Auto-lock on session lock / suspend / display off / idle (issue #15).
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    # Deleted vaults go to the Recycle Bin.
    "Win32_UI_Shell",
    # Authenticated browser-bridge pipe (issue #16).
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    # Per-user native-messaging host registration under HKCU (issue #53).
    "Win32_System_Registry",
    "Win32_System_Threading",
    # Crash reports exclude heap memory (issue #6).
    "Win32_System_ErrorReporting",
    # Safe memory scanning for memory hygiene regression tests (issue #59).
    "Win32_System_Diagnostics_Debug",
] }
# Windows Hello quick unlock (issue #66, docs/spec/windows-hello.md): WinRT KeyCredentialManager.
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
] }
# --- Additions ---
thiserror = "2"
tauri-plugin-dialog = "2"
unicode-normalization = "0.1"
tauri-plugin-single-instance = "2"
csv = "1"
base64 = "0.22"
# Browser bridge (issue #16, #54): request MACs, SPAKE2 pairing, origin normalization (IDNA, default ports).
hmac = "0.12"
spake2 = "0.4"
url = "2"
minisign-verify = "0.2"
semver = "1"
time = { version = "0.3", features = ["parsing"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# LAN sync (issue #156, docs/spec/lan-sync.md): Noise XX / XXpsk3 transport, sync identity
# fingerprints, and the time-boxed discovery responder. Pinned exactly per the spec; the
# discovery daemon is created only inside `net.rs` (the network gate).
snow = "=0.9.6"
blake2 = "0.10"
mdns-sd = { version = "=0.21.7", default-features = false, optional = true }
if-addrs = { version = "0.15", optional = true }

[dev-dependencies]
hex = "0.4"
minisign = "0.7"
tempfile = "3"

# Argon2 is unusably slow without optimisation; keep test/dev builds fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
