<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="shush: offline-first password manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0f"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="180" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="719" height="179" rx="15.5" fill="none" stroke="#27272a"/>
  <rect x="80" y="178" width="560" height="2" fill="url(#glow)"/>

  <!-- lock mark -->
  <g transform="translate(88 50)">
    <rect width="80" height="80" rx="18" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.45"/>
    <path d="M28 37v-7a12 12 0 0 1 24 0v7" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="22" y="37" width="36" height="27" rx="6" fill="none" stroke="#10b981" stroke-width="4"/>
    <circle cx="40" cy="50" r="3.5" fill="#10b981"/>
  </g>

  <text x="196" y="96" fill="#fafafa" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="54" font-weight="700" letter-spacing="2">shush</text>
  <text x="200" y="126" fill="#10b981" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="15" letter-spacing="3">// OFFLINE · ZERO-KNOWLEDGE · WINDOWS</text>
  <text x="634" y="62" fill="#06b6d4" fill-opacity="0.7" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="11" text-anchor="end">ARGON2ID 64M/t3/p4</text>
  <text x="634" y="80" fill="#06b6d4" fill-opacity="0.7" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="11" text-anchor="end">AES-256-GCM · XCHACHA20</text>
</svg>
