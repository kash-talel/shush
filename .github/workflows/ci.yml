name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · Rust + Svelte
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Frontend · install
        run: npm ci --prefix src

      - name: Frontend · type check (svelte-check)
        run: npm run --prefix src check

      - name: Frontend · build
        run: npm run --prefix src build

      - name: Rust · format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust · clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust · tests
        working-directory: src-tauri
        run: cargo test --lib
