name: Release

# Push a tag `vX.Y.Z` (matching the version in tauri.conf.json, Cargo.toml and src/package.json)
# to build the Windows installers and publish them as a GitHub release.
# Run it by hand (workflow_dispatch) for a dry run: same build, installers kept as workflow
# artifacts, no release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows · NSIS + MSI
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Version matches tag
        if: env.IS_TAG == 'true'
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.Substring(1)
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content src/package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if ($conf -ne $tag -or $pkg -ne $tag -or $cargo -ne $tag) {
            Write-Error "Tag v$tag does not match every version field. Bump them all, then re-tag."
            exit 1
          }

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Frontend · install
        run: npm ci --prefix src

      # A tag can point at a commit CI never saw, so gate the release on the same checks.
      - name: Frontend · type check (svelte-check)
        run: npm run --prefix src check

      - name: Rust · tests
        working-directory: src-tauri
        run: cargo test --lib

      # Builds src-tauri/target/release/bundle/{nsis,msi}. On a tag it also creates a *draft*
      # release and uploads both installers; the release is published only after the last step.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --prefix src tauri
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: shush ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Install

            Download **shush_x64-setup.exe** (the versioned `shush_<version>_x64-setup.exe` is the same file) and run it. No admin rights needed: it installs for your user only.

            The installer is not code-signed yet, so Windows SmartScreen may say *"Windows protected your PC"*. Click **More info → Run anyway**. Check the download first:

            ```powershell
            Get-FileHash .\shush_x64-setup.exe -Algorithm SHA256
            ```

            and compare it with `SHA256SUMS.txt` below.

            Uninstalling keeps your vault (`%APPDATA%\com.shush.vault`) unless you tick *Delete the application data* **and** confirm. Keep an encrypted `.shushbackup` either way.

            The `.msi` is for managed / Group Policy deployment; most people want the `.exe`.

      - name: Checksums and stable download name
        id: assets
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $exe = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          if (-not $exe -or -not $msi) { Write-Error 'Installer missing from bundle output'; exit 1 }
          $out = New-Item -ItemType Directory -Force release-assets
          Copy-Item $exe.FullName $out/$($exe.Name)
          Copy-Item $msi.FullName $out/$($msi.Name)
          # Fixed name so the website can link to releases/latest/download/shush_x64-setup.exe.
          Copy-Item $exe.FullName $out/shush_x64-setup.exe
          Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Move-Item SHA256SUMS.txt $out/
          Get-Content $out/SHA256SUMS.txt

      - name: Keep installers (dry run)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shush-windows-installers
          path: release-assets/
          retention-days: 14

      - name: Attach extras and publish release
        if: env.IS_TAG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload $env:TAG release-assets/shush_x64-setup.exe release-assets/SHA256SUMS.txt --clobber
          gh release edit $env:TAG --draft=false --latest
