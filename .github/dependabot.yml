version: 2
updates:
  # Every `uses:` is pinned to a full commit SHA; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # One weekly PR for all action bumps instead of one PR per action. Release/CI changes need
    # the ai-review path, so fewer, combined PRs are cheaper to verify.
    groups:
      github-actions:
        patterns: ["*"]
